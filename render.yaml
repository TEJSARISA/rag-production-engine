# Render Blueprint (Infrastructure-as-Code)
services:
  # Web Service: FastAPI API App
  - type: web
    name: rag-production-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rag-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        generateValue: true
      - key: EMBEDDING_MODEL
        value: "text-embedding-3-small"
      - key: LLM_MODEL
        value: "gpt-4o-mini"

  # Worker Service: Celery Background Ingestion Worker
  - type: worker
    name: rag-production-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q documents
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rag-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: "text-embedding-3-small"

  # Redis Broker
  - type: redis
    name: rag-redis
    region: singapore
    ipAllowList: []

databases:
  # Managed PostgreSQL DB with pgvector
  - name: rag-postgres
    databaseName: rag
    user: postgres
    region: singapore
    plan: free
