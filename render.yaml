services:
  # Web Service: FastAPI API App
  - type: web
    name: rag-production-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: rag-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: rag-postgres
    databaseName: ragdb
    user: raguser
    plan: free
    region: singapore
